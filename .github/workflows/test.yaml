name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      - name: Verilator lint
        run: |
          verilator --lint-only -Wall \
            --top-module tt_um_JAIMEPRYOR0_VGA_YAY \
            src/project.v src/spi_master.v src/vocoder.v src/filter.v src/pitch.v

      - name: Vocoder DSP test (test_vocoder.py)
        run: python test/test_vocoder.py

      - name: SPI master test (test_spi.py)
        run: python test/test_spi.py

      - name: Full chip integration test (test_chip.py, 5 pitches)
        run: python test/test_chip.py

      - name: Upload sim build artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-build
          path: test/sim_build
